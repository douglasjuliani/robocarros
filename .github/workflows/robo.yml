name: Robô de carros

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora (horário UTC)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write            # para salvar dados/vistos.json no repositório

concurrency:
  group: robo-carros
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Procurar carros
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          SMTP_SERVIDOR: ${{ secrets.SMTP_SERVIDOR }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
        run: python -m robo

      - name: Salvar anúncios já vistos
        if: always()
        run: |
          git config user.name "robo-carros"
          git config user.email "robo-carros@users.noreply.github.com"
          git add dados/vistos.json
          git diff --cached --quiet || git commit -m "Atualiza anúncios vistos"
          git push
