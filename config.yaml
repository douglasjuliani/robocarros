# ==== Configuração do robô de carros ====
# Edite as buscas abaixo. Todos os filtros são opcionais (apague a linha para não usar).

fontes: [olx, webmotors, mercadolivre, icarros]   # plataformas usadas por padrão
max_paginas: 15                   # páginas lidas por plataforma em cada busca
max_anuncios_por_email: 30        # limite de anúncios listados em cada e-mail

buscas:
  - nome: Duster
    marca: Renault
    modelo: Duster                # qualquer versão
    cambio: automatico            # automatico | manual (exige câmbio confirmado)
    ano_min: 2022                 # ano de fabricação
    km_max: 50000
    # preco_max: 120000           # opcional
    # uf: SC                      # opcional: sem isto, busca no Brasil todo
    excluir: [leilao, sinistro, batido, recuperado, sucata, troca, repasse]
